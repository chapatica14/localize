{% extends "base.html" %}
{% block conteudo %}
<section class="cartao cartao--etiqueta">
  <h1>Criar conta</h1>
  <form method="post" class="form">
    <label>Nome completo <input name="nome" required></label>
    <label>Email <input type="email" name="email" required></label>
    <label>Senha (mínimo 6 caracteres) <input type="password" name="senha" minlength="6" required></label>
    <fieldset>
      <legend>Como vai usar o Localize?</legend>
      <label class="opcao"><input type="radio" name="perfil" value="estudante" required> Sou estudante: perdi ou encontrei algo</label>
      <label class="opcao"><input type="radio" name="perfil" value="comunidade"> Faço parte da comunidade: encontrei algo</label>
    </fieldset>
    <p class="nota">As contas da Secretaria são criadas pelo administrador.</p>
    <button class="btn btn--primario">Criar conta</button>
  </form>
  <p>Já tem conta? <a href="{{ url_for('login') }}">Entrar</a></p>
</section>
{% endblock %}
