<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Localize · Achados e Perdidos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body>
  <header class="topo">
    <div class="container topo__barra">
      <a class="marca" href="{{ url_for('inicio') }}">Localize</a>
      <button class="menu-btn" aria-expanded="false" aria-controls="menu">Menu</button>
      <nav id="menu" class="menu" aria-label="Principal">
        {% if session.perfil %}
          <span class="quem">{{ session.nome }} · {{ session.perfil }}</span>
          <a href="{{ url_for('sair') }}">Sair</a>
        {% else %}
          <a href="{{ url_for('login') }}">Entrar</a>
          <a href="{{ url_for('registo') }}">Criar conta</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="container pagina">
    {% for cat, msg in get_flashed_messages(with_categories=true) %}
      <p class="aviso aviso--{{ cat }}" role="status">{{ msg }}</p>
    {% endfor %}
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
